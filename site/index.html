<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Los Buitres — Estadísticas</title>
  <script>
    // aplicar el tema guardado ANTES del primer pintado, si no hay un flash
    // del tema equivocado al cargar (ver construirToggleTema() en ui.js).
    try {
      var tema = localStorage.getItem("tema");
      if (tema) document.documentElement.setAttribute("data-theme", tema);
    } catch (e) {}
  </script>
  <meta name="description" content="Estadísticas del equipo Los Buitres: resumen, tabla de jugadores, partidos, gráficos y dúos asistidor-goleador, con filtros." />
  <link rel="icon" type="image/png" href="media/cuadrada-transparente.png" />

  <!-- PWA: instalable en el celular ("agregar a pantalla de inicio") -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1f6f4a" />
  <link rel="apple-touch-icon" href="media/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Los Buitres" />

  <!-- preview al compartir el link (WhatsApp, etc.): URLs absolutas, varios
       sitios de preview no resuelven bien las relativas. -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://nachomondino1.github.io/buitres-stats/" />
  <meta property="og:title" content="Los Buitres — Estadísticas" />
  <meta property="og:description" content="Resumen, tabla de jugadores, partidos, gráficos y dúos asistidor-goleador, con filtros." />
  <meta property="og:image" content="https://nachomondino1.github.io/buitres-stats/media/cuadrada-transparente.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Los Buitres — Estadísticas" />
  <meta name="twitter:image" content="https://nachomondino1.github.io/buitres-stats/media/cuadrada-transparente.png" />
  <link rel="stylesheet" href="css/styles.css" />

  <!-- Medición de visitas: GoatCounter (sin cookies, no requiere aviso de
       consentimiento). Ver DECISIONS.md. -->
  <script data-goatcounter="https://buitres.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="app-header-fila">
      <h1><button type="button" class="boton-titulo" id="boton-titulo">Los Buitres — Estadísticas</button></h1>
      <div class="app-header-acciones">
        <button type="button" class="boton-tema" id="boton-tema" aria-label="Cambiar tema">🌓</button>
        <button type="button" class="boton-compartir" id="boton-compartir">Compartir</button>
      </div>
    </div>
    <p>Filtrá por tipo de partido, rival, resultado o cantidad de últimos partidos.</p>
  </header>

  <div class="filtros" aria-label="Filtros"></div>

  <nav class="tabs" role="tablist" aria-label="Vistas"></nav>

  <main>
    <div class="skeleton" aria-hidden="true">
      <div class="skeleton-bloque" style="width:40%;height:1rem"></div>
      <div class="skeleton-bloque" style="height:4.5rem"></div>
      <div class="skeleton-grid">
        <div class="skeleton-bloque"></div>
        <div class="skeleton-bloque"></div>
      </div>
      <div class="skeleton-grid">
        <div class="skeleton-bloque"></div>
        <div class="skeleton-bloque"></div>
        <div class="skeleton-bloque"></div>
      </div>
    </div>
    <p class="estado-carga visually-hidden">Cargando datos…</p>
  </main>

  <footer class="app-footer"></footer>

  <script src="vendor/chart.min.js" defer></script>
  <script type="module" src="js/ui.js"></script>
</body>
</html>
